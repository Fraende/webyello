<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Testisivu — WebYello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#E7E9E3;--ink:#16171C;--cobalt:#2452C6;--mustard:#F2B705;--slate:#4F5669}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Work Sans',sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
  main{flex:1;display:grid;align-content:center;padding:clamp(48px,10vh,120px) clamp(24px,6vw,96px)}
  h1{font-family:'Familjen Grotesk',sans-serif;font-weight:700;font-size:clamp(3rem,11vw,9rem);line-height:.95;letter-spacing:-.03em;max-width:9ch}
  h1 .rule{display:block;width:min(18rem,60%);height:.18em;background:var(--mustard);margin-top:.12em}
  p.lead{font-size:clamp(1.05rem,1.6vw,1.25rem);max-width:38ch;margin-top:40px;color:var(--slate)}
  .actions{margin-top:48px}
  .link{font-weight:600;font-size:1rem;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
  .link:hover{color:var(--cobalt)}
  footer{padding:24px clamp(24px,6vw,96px);font-size:.9rem;color:var(--slate)}
</style>
</head>
<body>
<main>
  <h1>Testisivu<span class="rule" aria-hidden="true"></span></h1>
  <p class="lead">Tämä on yksinkertainen esimerkkisivu. Sitä käytetään tarkistamaan, miltä demo näyttää ja toimii.</p>
  <p class="actions"><a class="link" href="/demos/">Takaisin demoihin</a></p>
</main>
<footer>WebYello · Testisivu, ei asiakassivu.</footer>
</body>
</html>
